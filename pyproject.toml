[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks-paper-bot"
version = "0.1.0"
description = "Dry-run stock-market paper trading bot powered by TradingView MCP."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stonks-paper = "stonks_bot.cli:main"
hermes-bloomberg-collect = "stonks_bot.bloomberg_collector:main"

[tool.setuptools.packages.find]
include = ["stonks_bot*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
