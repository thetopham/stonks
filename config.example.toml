# Local paper ledger by default. Alpaca paper order submission is available only when
# broker.submit_orders=true, broker.paper_only=true, and the endpoint is the Alpaca paper endpoint.
ledger_path = "data/paper-ledger.sqlite3"
starting_cash = 100000.0
max_position_pct = 0.10
max_open_positions = 5
commission_pct = 0.00
slippage_pct = 0.02

[execution]
dry_run = true
live_trading_enabled = false
# Active paper cadence: scan every 30 minutes using 4h technical analysis.
scan_interval_seconds = 1800

[strategy]
entry_score = 65
exit_score = 35
max_rsi_for_entry = 70
stop_loss_pct = 0.07
take_profit_pct = 0.15

[selection]
# Ranked mode scores the whole universe first, processes exits, then buys the best candidates.
mode = "ranked"
preview_top = 10

[screener]
# curated = watchlist/curated baskets only.
# mcp = use TradingView MCP screeners across exchanges, then deep-score the best candidates.
# hybrid = MCP screeners plus curated local baskets.
enabled = false
source = "curated"
universes = ["watchlist", "etf_core", "nasdaq_mega", "nyse_mega", "ai_infra", "crypto_major"]
exchanges = ["NASDAQ", "NYSE", "BINANCE", "KUCOIN"]
dynamic_sources = ["rating_strong_buy", "rating_buy", "volume_breakout", "smart_volume", "top_gainers"]
per_source_limit = 50
max_candidates = 100
exclude_symbols = []

[optimizer]
enabled = true
cash_reserve_pct = 0.05
max_new_buys_per_scan = 3
min_position_notional = 25

[options]
# Defined-risk options overlay.
#   options-scan   = read-only chain scan
#   options-paper     = local paper options loop; syncs cash from Alpaca paper options
#                       buying power and submits Alpaca paper option orders only when
#                       broker.submit_orders=true and options.submit_orders=true
#   options-sync-cash = read-only options buying-power sync for dashboard/risk basis
#   options-status    = local ledger status only
# The watch service runs options-paper automatically only when auto_trade=true.
enabled = true
auto_trade = false
submit_orders = false
underlying_symbols = ["SPY", "QQQ", "IWM", "AAPL", "MSFT", "NVDA", "AMD", "TSLA", "META", "AMZN", "GOOGL"]
min_dte = 30
max_dte = 60
target_dte = 45
min_open_interest = 100
max_spread_pct = 0.20
max_contract_debit = 750
max_trade_risk_pct = 0.01
contracts_per_trade = 1
max_open_positions = 5
allow_calls = true
allow_puts = true
quote_feed = "indicative"
stop_loss_pct = 0.50
take_profit_pct = 0.50
min_exit_dte = 14
strike_pct_window = 0.15
max_underlyings_per_scan = 20

[provider]
command = "/home/matt/.local/bin/uvx"
args = ["--from", "tradingview-mcp-server", "tradingview-mcp"]
timeframe = "4h"

[broker]
name = "alpaca"
endpoint_env = "alpaca_endpoint"
key_env = "alpaca_key"
secret_env = "alpaca_secret"
paper_only = true
submit_orders = false
# Alpaca 24/5 equity trading/overnight orders require account support and use limit orders.
equity_extended_hours = false
equity_extended_hours_time_in_force = "day"

[[watchlist]]
symbol = "AAPL"
exchange = "NASDAQ"

[[watchlist]]
symbol = "MSFT"
exchange = "NASDAQ"

[[watchlist]]
symbol = "SPY"
exchange = "NYSE"

[[watchlist]]
symbol = "BTCUSDT"
exchange = "BINANCE"
asset_class = "crypto"
broker_symbol = "BTC/USD"

[[watchlist]]
symbol = "ETHUSDT"
exchange = "BINANCE"
asset_class = "crypto"
broker_symbol = "ETH/USD"
