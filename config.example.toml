# Dry-run only. This bot never submits broker orders.
ledger_path = "data/paper-ledger.sqlite3"
starting_cash = 100000.0
max_position_pct = 0.10
max_open_positions = 5
commission_pct = 0.00
slippage_pct = 0.02

[execution]
dry_run = true
live_trading_enabled = false
scan_interval_seconds = 900

[strategy]
entry_score = 65
exit_score = 35
max_rsi_for_entry = 70
stop_loss_pct = 0.07
take_profit_pct = 0.15

[provider]
command = "/home/matt/.local/bin/uvx"
args = ["--from", "tradingview-mcp-server", "tradingview-mcp"]
timeframe = "1D"

[[watchlist]]
symbol = "AAPL"
exchange = "NASDAQ"

[[watchlist]]
symbol = "MSFT"
exchange = "NASDAQ"

[[watchlist]]
symbol = "SPY"
exchange = "NYSE"
