extends = "../../config.paper.toml"
name = "swing-60m-1d"
description = "Conservative swing test: 60m cadence with 1d analysis."
enabled = true
ledger_path = "data/farm/swing-60m-1d.sqlite3"

[execution]
dry_run = true
live_trading_enabled = false
scan_interval_seconds = 3600
initial_delay_seconds = 600

[provider]
timeframe = "1d"

[screener]
per_source_limit = 10
max_candidates = 12
dynamic_sources = ["rating_strong_buy", "rating_buy", "volume_breakout", "top_gainers"]

[broker]
submit_orders = false
equity_extended_hours = false

[options]
enabled = false
auto_trade = false
submit_orders = false
