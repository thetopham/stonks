extends = "../../config.paper.toml"
name = "original-15m-1d"
description = "Original baseline: 15m scan cadence with 1d TradingView analysis."
enabled = true
ledger_path = "data/farm/original-15m-1d.sqlite3"

[execution]
dry_run = true
live_trading_enabled = false
scan_interval_seconds = 900
initial_delay_seconds = 0

[provider]
timeframe = "1d"

[screener]
per_source_limit = 10
max_candidates = 12
dynamic_sources = ["rating_strong_buy", "rating_buy", "volume_breakout", "top_gainers"]

[broker]
submit_orders = false
equity_extended_hours = false

[options]
enabled = false
auto_trade = false
submit_orders = false
