extends = "../../config.paper.toml"
name = "intraday-30m-1h"
description = "1h analysis with calmer 30m cadence to compare against the 15m intraday variant."
enabled = true
ledger_path = "data/farm/intraday-30m-1h.sqlite3"

[execution]
dry_run = true
live_trading_enabled = false
scan_interval_seconds = 1800
initial_delay_seconds = 480

[provider]
timeframe = "1h"

[screener]
source = "curated"
universes = ["indices", "watchlist"]
max_candidates = 50

[broker]
submit_orders = false
equity_extended_hours = false

[options]
enabled = false
auto_trade = false
submit_orders = false
