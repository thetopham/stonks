extends = "../../config.paper.toml"
name = "balanced-30m-4h"
description = "Current balanced paper-control shape: 30m cadence with 4h analysis, shadow ledger only."
enabled = true
ledger_path = "data/farm/balanced-30m-4h.sqlite3"

[execution]
