# Local paper ledger by default. Alpaca paper order submission is available only when
# broker.submit_orders=true, broker.paper_only=true, and the endpoint is the Alpaca paper endpoint.
ledger_path = "data/paper-ledger.sqlite3"
starting_cash = 100000.0
max_position_pct = 0.10
max_open_positions = 25
commission_pct = 0.00
slippage_pct = 0.02

[execution]
dry_run = true
live_trading_enabled = false
scan_interval_seconds = 900

[strategy]
entry_score = 65
exit_score = 35
max_rsi_for_entry = 70
stop_loss_pct = 0.07
take_profit_pct = 0.15

[selection]
mode = "ranked"
preview_top = 15

[screener]
# Use MCP screeners across NASDAQ/NYSE first; the watchlist is only a guaranteed seed.
# max_candidates caps the slower deep combined_analysis pass after dynamic discovery.
enabled = true
source = "mcp"
universes = ["watchlist"]
exchanges = ["NASDAQ", "NYSE"]
dynamic_sources = ["rating_strong_buy", "rating_buy", "volume_breakout", "smart_volume", "top_gainers"]
per_source_limit = 50
max_candidates = 100
exclude_symbols = []

[optimizer]
enabled = true
cash_reserve_pct = 0.05
max_new_buys_per_scan = 10
min_position_notional = 25

[options]
# Defined-risk options overlay. The background bot will scan automatically and, when a
# qualifying setup appears, sync options cash from Alpaca paper options buying power, then submit
# long-call/long-put limit orders to the Alpaca paper endpoint only. Local SQLite remains
# the source of truth for dashboard/reporting.
enabled = true
auto_trade = true
submit_orders = true
underlying_symbols = ["SPY", "QQQ", "IWM", "AAPL", "MSFT", "NVDA", "AMD", "TSLA", "META", "AMZN", "GOOGL"]
min_dte = 30
max_dte = 60
target_dte = 45
min_open_interest = 100
max_spread_pct = 0.20
max_contract_debit = 750
max_trade_risk_pct = 0.01
contracts_per_trade = 1
max_open_positions = 5
allow_calls = true
allow_puts = true
quote_feed = "indicative"
stop_loss_pct = 0.50
take_profit_pct = 0.50
min_exit_dte = 14
strike_pct_window = 0.15
max_underlyings_per_scan = 20

[provider]
command = "/home/matt/.local/bin/uvx"
args = ["--from", "tradingview-mcp-server", "tradingview-mcp"]
timeframe = "1D"

[broker]
name = "alpaca"
endpoint_env = "alpaca_endpoint"
key_env = "alpaca_key"
secret_env = "alpaca_secret"
paper_only = true
submit_orders = true

